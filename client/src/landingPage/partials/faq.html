<!-- faq.html — FAQ accordion section -->
<!-- @page-specific: ALL question/answer pairs -->
<!-- CSS for #faq background gradient and centered section-head is in landing-shared.css -->

<section class="block" id="faq">
  <div class="container">
    <div class="section-head reveal">
      <div>
        <div class="section-tag">שאלות נפוצות</div>
        <!-- @page-specific: title -->
        <h2 class="section-title">דברים שכדאי לדעת לפני שמצטרפים</h2>
      </div>
    </div>

    <div class="faq reveal">
      <!-- @page-specific: each <details> question and answer -->
      <details class="faq-item">
        <summary>
          <span>זה באמת חינם? מה הקאצ'?</span>
          <span class="plus">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </span>
        </summary>
        <div class="faq-body">
          כן. אין דמי הצטרפות, אין דמי מנוי, ואין עמלה על עבודות שאתה סוגר.
        </div>
      </details>

      <details class="faq-item">
        <summary>
          <span>שאלה 2...</span>
          <span class="plus">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </span>
        </summary>
        <div class="faq-body">תשובה 2...</div>
      </details>

      <!-- Add more <details class="faq-item"> blocks as needed -->
    </div>
  </div>
</section>
